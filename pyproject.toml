[project]
name = "kronos"
version = "0.1.0"
description = "A foundation model for financial candlestick (K-line) sequences"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "eshyun", email = "eshyun@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "huggingface-hub>=0.33.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "safetensors>=0.6.2",
    "torch>=2.0.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
examples = [
    "akshare",
    "baostock",
    "matplotlib>=3.9",
    "requests>=2.31",
]
webui = [
    "flask==2.3.3",
    "flask-cors==4.0.0",
    "plotly>=5.17.0",
]
qlib = ["pyqlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
